<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1160" viewBox="0 0 1300 1160"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#34445a"/></marker></defs><rect width="1300" height="1160" fill="white"/><g font-family="Arial,sans-serif" font-size="14" fill="#17253b"><text x="35" y="35" font-size="24">Airport Operations — UML class diagram</text><rect x="510" y="60" width="260" height="62" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M510,92 h260" stroke="#34445a"/><text x="520" y="82" font-size="16">Client</text><text x="520" y="114" font-size="12">+ main(args)</text><rect x="260" y="195" width="330" height="122" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M260,227 h330" stroke="#34445a"/><text x="270" y="217" font-size="16">DepartureFacade</text><text x="270" y="249" font-size="12">- kiosk: Kiosk; baggage: BaggageHandler</text><text x="270" y="269" font-size="12">- gate: GateController; chains: ChainRepository</text><text x="270" y="289" font-size="12">+ depart(Journey); start(Journey, steps)</text><text x="270" y="309" font-size="12">+ resume(id); compensate(id)</text><rect x="780" y="195" width="280" height="102" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M780,227 h280" stroke="#34445a"/><text x="790" y="217" font-size="16">AdminFacade</text><text x="790" y="249" font-size="12">- root: Path</text><text x="790" y="269" font-size="12">+ ids(); inspect(id)</text><text x="790" y="289" font-size="12">+ compensate(id)</text><polyline points="585,122 425,195" fill="none" stroke="#34445a" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="705,122 920,195" fill="none" stroke="#34445a" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="780,250 590,250" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="35" y="400" width="345" height="82" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M35,432 h345" stroke="#34445a"/><text x="45" y="422" font-size="16">Kiosk</text><text x="45" y="454" font-size="12">- file: Path</text><text x="45" y="474" font-size="12">+ issue(id, name); cancel(id); find(id)</text><rect x="475" y="400" width="345" height="102" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M475,432 h345" stroke="#34445a"/><text x="485" y="422" font-size="16">BaggageHandler</text><text x="485" y="454" font-size="12">- file: Path</text><text x="485" y="474" font-size="12">+ screen(id, weight, prohibited)</text><text x="485" y="494" font-size="12">+ cancel(id); find(id)</text><rect x="915" y="400" width="345" height="102" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M915,432 h345" stroke="#34445a"/><text x="925" y="422" font-size="16">GateController</text><text x="925" y="454" font-size="12">- file: Path</text><text x="925" y="474" font-size="12">+ clear(id, valid, declared)</text><text x="925" y="494" font-size="12">+ cancel(id); find(id)</text><polyline points="340,317 340,360 207,360 207,400" fill="none" stroke="#34445a" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="425,317 425,370 647,370 647,400" fill="none" stroke="#34445a" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="510,317 510,345 1087,345 1087,400" fill="none" stroke="#34445a" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="830,297 830,385 285,385 285,400" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="920,297 920,380 740,380 740,400" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="1010,297 1170,370 1170,400" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="35" y="570" width="345" height="102" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M35,602 h345" stroke="#34445a"/><text x="45" y="592" font-size="16">BoardingPass</text><text x="45" y="624" font-size="12">- status: Status</text><text x="45" y="644" font-size="12">+ issue(); cancel(); status()</text><text x="45" y="664" font-size="12">Status: NEW, ISSUED, CANCELLED</text><rect x="475" y="570" width="345" height="102" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M475,602 h345" stroke="#34445a"/><text x="485" y="592" font-size="16">BaggageRecord</text><text x="485" y="624" font-size="12">- status: Status</text><text x="485" y="644" font-size="12">+ screen(); cancel(); status()</text><text x="485" y="664" font-size="12">Status: NEW, SCREENED, CANCELLED</text><rect x="915" y="570" width="345" height="102" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M915,602 h345" stroke="#34445a"/><text x="925" y="592" font-size="16">Clearance</text><text x="925" y="624" font-size="12">- status: Status</text><text x="925" y="644" font-size="12">+ clear(); cancel(); status()</text><text x="925" y="664" font-size="12">Status: NEW, CLEARED, CANCELLED</text><polyline points="170,482 170,570" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="610,502 610,570" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="1050,502 1050,570" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="35" y="760" width="345" height="62" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M35,792 h345" stroke="#34445a"/><text x="45" y="782" font-size="16">BoardingPassIssuer</text><text x="45" y="814" font-size="12">+ validate(name)</text><rect x="475" y="760" width="345" height="62" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M475,792 h345" stroke="#34445a"/><text x="485" y="782" font-size="16">SecurityScreening</text><text x="485" y="814" font-size="12">+ validate(weight, prohibited)</text><rect x="915" y="740" width="345" height="62" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M915,772 h345" stroke="#34445a"/><text x="925" y="762" font-size="16">PassportControl</text><text x="925" y="794" font-size="12">+ validate(valid)</text><rect x="915" y="855" width="345" height="62" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M915,887 h345" stroke="#34445a"/><text x="925" y="877" font-size="16">CustomsDeclaration</text><text x="925" y="909" font-size="12">+ validate(declared)</text><polyline points="80,482 15,510 15,790 35,790" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="520,502 450,530 450,790 475,790" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="1220,502 1280,530 1280,770 1260,770" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="1240,502 1290,540 1290,885 1260,885" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="35" y="950" width="345" height="102" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M35,982 h345" stroke="#34445a"/><text x="45" y="972" font-size="16">ChainRepository</text><text x="45" y="1004" font-size="12">- directory: Path</text><text x="45" y="1024" font-size="12">+ create(Journey); load(id); ids()</text><text x="45" y="1044" font-size="12">+ stage(id); stage(id, Stage)</text><rect x="475" y="950" width="345" height="82" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M475,982 h345" stroke="#34445a"/><text x="485" y="972" font-size="16">Journey «record»</text><text x="485" y="1004" font-size="12">id, passenger, weight, prohibited</text><text x="485" y="1024" font-size="12">passportValid, customsDeclared</text><rect x="915" y="970" width="345" height="82" rx="2" fill="#f1f5fa" stroke="#34445a"/><path d="M915,1002 h345" stroke="#34445a"/><text x="925" y="992" font-size="16">Disk «utility»</text><text x="925" y="1024" font-size="12">+ read(Path); write(Path, Properties)</text><text x="925" y="1044" font-size="12">+ key(id)</text><polyline points="260,280 5,280 5,1010 35,1010" fill="none" stroke="#34445a" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="380,1010 475,1010" fill="none" stroke="#34445a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="35" y="1105" font-size="14">Solid arrow: held dependency. Dashed arrow: use/create. All persistence gateways use Disk.</text><text x="35" y="1128" font-size="14">DepartureFacade uses Journey. AirportException extends RuntimeException and is used by rules, entities and validation.</text><text x="35" y="1150" font-size="14">No dependencies between A (left), B (middle) and C (right). Standard JDK types are omitted.</text></g></svg>